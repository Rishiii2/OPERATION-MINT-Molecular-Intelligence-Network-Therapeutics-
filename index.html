<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATION MINT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container">
        <canvas id="networkGraph"></canvas>
    </div>

    <div class="overlay">
        <header>
            <div class="logo">
                <span class="bank-icon">🏦</span>
                <h1>OPERATION MINT</h1>
            </div>
            <div class="status-indicator">
                <div class="dot pulse"></div>
                <span>SYSTEM ARMED</span>
            </div>
        </header>

        <main class="dashboard">
            <!-- Left Panel: Input -->
            <section class="panel glass">
                <h2>The Blueprint</h2>
                <p class="subtitle">Enter target genomic data to initiate the heist.</p>
                
                <div class="input-group">
                    <label>PATIENT ALIAS</label>
                    <input type="text" value="PZ-2026-X" readonly>
                </div>

                <div class="input-group">
                    <label>GENOMIC MUTATION VECTOR</label>
                    <textarea readonly>>chr17:41196150-41277500
BRCA1 c.5266dupC (p.Gln1756Profs*74)
Status: Pathogenic
Target: Undruggable Vault</textarea>
                </div>

                <button id="btn-execute" class="btn-primary">
                    <span class="btn-text">EXECUTE HEIST</span>
                    <span class="btn-glitch"></span>
                </button>
            </section>

            <!-- Center Panel: Visualization -->
            <section class="panel transparent center-panel">
                <div class="visualizer-overlay">
                    <h2 id="graph-status">ANALYZING THE VAULT</h2>
                    <div id="molecule-display" class="hidden">
                        <svg width="200" height="200" viewBox="0 0 100 100">
                            <!-- Dummy abstract molecular shape -->
                            <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="#E50914" stroke-width="2" class="poly-glow"/>
                            <circle cx="50" cy="50" r="15" fill="#E50914"/>
                            <line x1="50" y1="50" x2="90" y2="30" stroke="#fff" stroke-width="2"/>
                            <line x1="50" y1="50" x2="10" y2="70" stroke="#fff" stroke-width="2"/>
                            <circle cx="90" cy="30" r="5" fill="#fff"/>
                            <circle cx="10" cy="70" r="5" fill="#fff"/>
                        </svg>
                        <h3>SYNTHESIS COMPLETE</h3>
                        <p class="smiles">SMILES: O=C(c1ccc(Cc2n[nH]c(=O)c3ccccc23)cc1F)N1CCN...</p>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Swarm Terminal -->
            <section class="panel glass">
                <h2>Swarm Terminal</h2>
                <div class="terminal-container" id="terminal">
                    <div class="log-line">
                        <span class="system">[SYSTEM]</span> Awaiting Professor's orders...
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
